name: Deploy to GreenNode AgentBase

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch: {}

env:
  RUNTIME_NAME: m-insight-360
  FLAVOR: runtime-s2-general-2x4
  CR_REGISTRY: vcr.vngcloud.vn
  CR_REPOSITORY: 111480-abp114553

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      GREENNODE_CLIENT_ID: ${{ secrets.GREENNODE_CLIENT_ID }}
      GREENNODE_CLIENT_SECRET: ${{ secrets.GREENNODE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t "${RUNTIME_NAME}:${GITHUB_SHA}" .

      # `cr.sh` (API-driven CR credentials) returns PROVISIONING_FAILED for this
      # service account (GREENNODE_CLIENT_ID/SECRET) even though the CR repo
      # already exists and works fine under the human console login — looks like
      # this service account is missing the vcrFullAccess policy. Logging in with
      # the credentials from the Container Registry console page directly instead
      # of going through cr.sh. Switch back to `cr.sh --from-cr` once the service
      # account's CR permission is fixed.
      - name: Log in to GreenNode Container Registry
        run: echo "${{ secrets.GREENNODE_CR_PASSWORD }}" | docker login "$CR_REGISTRY" -u "${{ secrets.GREENNODE_CR_USERNAME }}" --password-stdin

      - name: Tag & push image
        id: image
        timeout-minutes: 8
        run: |
          IMAGE="${CR_REGISTRY}/${CR_REPOSITORY}/${RUNTIME_NAME}:${GITHUB_SHA}"
          docker tag "${RUNTIME_NAME}:${GITHUB_SHA}" "$IMAGE"
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Write registry credentials file
        run: |
          jq -n \
            --arg username "${{ secrets.GREENNODE_CR_USERNAME }}" \
            --arg password "${{ secrets.GREENNODE_CR_PASSWORD }}" \
            --arg registry "$CR_REGISTRY" \
            --arg repository "$CR_REPOSITORY" \
            '{username:$username, password:$password, registry:$registry, repository:$repository}' \
            > /tmp/registry-credentials.json

      # Without this, the deployed runtime has no LLM_API_KEY at all (runtime.sh
      # defaults environmentVariables to {} when --env-file is omitted), so every
      # OCR call 401s in production. Only write lines whose secret is actually
      # set, since an empty VALUE= would override app/config.py's sensible
      # defaults (LLM_BASE_URL, OCR_VISION_MODEL, NARRATIVE_MODEL) with blanks.
      - name: Write runtime env file
        run: |
          : > /tmp/runtime.env
          [ -n "${{ secrets.LLM_API_KEY }}" ] && echo "LLM_API_KEY=${{ secrets.LLM_API_KEY }}" >> /tmp/runtime.env
          [ -n "${{ secrets.LLM_BASE_URL }}" ] && echo "LLM_BASE_URL=${{ secrets.LLM_BASE_URL }}" >> /tmp/runtime.env
          [ -n "${{ secrets.OCR_VISION_MODEL }}" ] && echo "OCR_VISION_MODEL=${{ secrets.OCR_VISION_MODEL }}" >> /tmp/runtime.env
          [ -n "${{ secrets.NARRATIVE_MODEL }}" ] && echo "NARRATIVE_MODEL=${{ secrets.NARRATIVE_MODEL }}" >> /tmp/runtime.env
          if [ ! -s /tmp/runtime.env ]; then
            echo "::warning::LLM_API_KEY secret is not set — OCR/narrative calls will fail in production."
          fi

      - name: Find existing runtime by name
        id: existing
        run: |
          ID=""
          PAGE=1
          while :; do
            RESP=$(bash .claude/skills/agentbase/scripts/runtime.sh list --page "$PAGE" --size 100)
            ID=$(echo "$RESP" | jq -r --arg NAME "$RUNTIME_NAME" '.listData[]? | select(.name==$NAME) | .id' | head -1)
            if [ -n "$ID" ]; then break; fi
            TOTAL_PAGE=$(echo "$RESP" | jq -r '.totalPage // 1')
            if [ "$PAGE" -ge "$TOTAL_PAGE" ]; then break; fi
            PAGE=$((PAGE + 1))
          done
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Check POC wallet eligibility
        id: wallet
        run: |
          RESP=$(bash .claude/skills/agentbase/scripts/billing.sh can-use-poc)
          echo "poc=$(echo "$RESP" | jq -r '.canUseRuntimePoc // false')" >> "$GITHUB_OUTPUT"

      - name: Create runtime (first deploy)
        if: steps.existing.outputs.id == ''
        run: |
          bash .claude/skills/agentbase/scripts/runtime.sh create \
            --name "$RUNTIME_NAME" \
            --image "${{ steps.image.outputs.image }}" \
            --flavor "$FLAVOR" \
            --registry-credentials-file /tmp/registry-credentials.json \
            --env-file /tmp/runtime.env \
            --poc "${{ steps.wallet.outputs.poc }}" \
            --min-replicas 1 --max-replicas 1 \
            --cpu-scale 50 --mem-scale 50

      - name: Update runtime (subsequent deploys)
        if: steps.existing.outputs.id != ''
        run: |
          bash .claude/skills/agentbase/scripts/runtime.sh update "${{ steps.existing.outputs.id }}" \
            --image "${{ steps.image.outputs.image }}" \
            --flavor "$FLAVOR" \
            --registry-credentials-file /tmp/registry-credentials.json \
            --env-file /tmp/runtime.env

      - name: Resolve runtime ID
        id: rt
        run: |
          ID="${{ steps.existing.outputs.id }}"
          if [ -z "$ID" ]; then
            RESP=$(bash .claude/skills/agentbase/scripts/runtime.sh list --page 1 --size 100)
            ID=$(echo "$RESP" | jq -r --arg NAME "$RUNTIME_NAME" '.listData[]? | select(.name==$NAME) | .id' | head -1)
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Get endpoint URL
        id: endpoint
        run: |
          URL=""
          for i in $(seq 1 10); do
            RESP=$(bash .claude/skills/agentbase/scripts/runtime.sh endpoints list "${{ steps.rt.outputs.id }}")
            URL=$(echo "$RESP" | jq -r '.listData[]? | select(.name=="DEFAULT") | .url // empty' | head -1)
            if [ -n "$URL" ]; then break; fi
            echo "endpoint url not ready yet, retrying..."
            sleep 6
          done
          if [ -z "$URL" ]; then
            echo "::error::Could not resolve the DEFAULT endpoint URL after retries."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Health check
        run: |
          URL="${{ steps.endpoint.outputs.url }}"
          for i in $(seq 1 20); do
            CODE=$(curl -s -m 10 -o /dev/null -w "%{http_code}" "$URL/health" || echo "000")
            echo "attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Runtime is healthy."
              exit 0
            fi
            sleep 15
          done
          echo "Runtime did not become healthy in time."
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy summary"
            echo "- Runtime: $RUNTIME_NAME"
            echo "- Image: ${{ steps.image.outputs.image }}"
            echo "- Endpoint: ${{ steps.endpoint.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
